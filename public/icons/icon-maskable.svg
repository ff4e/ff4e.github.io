      <stop offset="0%" stop-color="#182238"/>
      <stop offset="100%" stop-color="#0a0d16"/>
    </linearGradient>
    <linearGradient id="mbody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5fd0ff"/>
