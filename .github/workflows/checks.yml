# Fast checks on every push and pull request.
#
# Why this exists: until now every verification in this repo ran inside somebody's
# working session, which meant a five-minute wait before a one-line change could be
# trusted — and a skipped check whenever that felt too expensive.
#
# What it deliberately does NOT do is run the browser probes (`npm run test:ui`).
# Those need the original game data, which is copyrighted and not in the repo. That
# is not a reason to have no CI: measured on 2026-08-09, with no game data present at
# all, `vitest run` still passes 1522 of 1590 tests in 3.3 seconds — the data-dependent
# ones skip themselves cleanly (see test/solutions.test.ts). So this covers typecheck
# plus 96% of the unit suite, and the UI probes stay a local, pre-PR gate.
name: Checks

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The unit suite seeds Math.random per file and per test (test/rng.setup.ts), so
      # this is deterministic without pinning a seed here.
      - run: npm run test
