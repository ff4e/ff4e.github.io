# Fast checks on every push and pull request.
#
# Why this exists: until now every verification in this repo ran inside somebody's
# working session, which meant a five-minute wait before a one-line change could be
# trusted — and a skipped check whenever that felt too expensive.
#
# What it deliberately does NOT do is run the browser probes (`npm run test:ui`).
# The reason is NOT missing data — `public/data/` is committed (318 files), so the
# probes could in principle run here. It is that the suite takes ~5-6 minutes plus a
# Playwright browser download, and the ten `test-gl-*` probes ask Chromium for
# `--use-angle=metal`, which is macOS-only; on a Linux runner they would not be
# testing the backend they exist to test. So the probes stay a local pre-PR gate, and
# adding a macOS job later is a real option rather than an impossibility.
#
# The unit suite, by contrast, is nearly free — and it now includes the solvability net:
# all 62 recorded reference solutions are replayed here on every push. That used to skip,
# because the replays were keyed on a PRIVATE extraction of the game at ~/.cache/ffng-orig
# which no runner has, so 62 assertions vanished silently and this job still went green.
# There was never a reason for it: the room data is GPL-released (CONTRIBUTING.md) and all
# 72 Graphic/*.ffr are committed under public/data/, which is also why the note above says
# the probes could in principle run here. test/gameData.ts now resolves to that data, and
# missing data fails instead of skipping.
#
# A few tests still default to ~/.cache/ffng-orig and do skip here (rooms.test.ts,
# gral-pushout.test.ts, and $FF_DATA_DIR in render-parity/enhanced-mapping) — about 208
# assertions that could be unskipped the same way, separately from the solvability work.
#
# `vite build` runs too. `tsc --noEmit` does not link or resolve assets, so a bundling
# break (a bad import path, an esbuild-only failure) passes typecheck and fails only
# when somebody serves the app — which, without this step, would be nobody until the
# release tag.
name: Checks

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The unit suite seeds Math.random per file and per test (test/rng.setup.ts), so
      # this is deterministic without pinning a seed here.
      - run: npm run test
      # Not covered by typecheck: bundling, asset resolution, esbuild-only failures.
      - run: npm run build
