# Fast checks on every push and pull request.
#
# Why this exists: until now every verification in this repo ran inside somebody's
# working session, which meant a five-minute wait before a one-line change could be
# trusted — and a skipped check whenever that felt too expensive.
#
# What it deliberately does NOT do is run the browser probes (`npm run test:ui`).
# The reason is NOT missing data — `public/data/` is committed (318 files), so the
# probes could in principle run here. It is that the suite takes ~5-6 minutes plus a
# Playwright browser download, and the ten `test-gl-*` probes ask Chromium for
# `--use-angle=metal`, which is macOS-only; on a Linux runner they would not be
# testing the backend they exist to test. So the probes stay a local pre-PR gate, and
# adding a macOS job later is a real option rather than an impossibility.
#
# The unit suite, by contrast, is nearly free — and it now includes the solvability net:
# all 63 recorded reference solutions are replayed here on every push. That used to skip,
# because the replays were keyed on a PRIVATE extraction of the game at ~/.cache/ffng-orig
# which no runner has, so every one of those assertions vanished silently and this job still went green.
# There was never a reason for it: the room data is GPL-released (CONTRIBUTING.md) and all
# 72 Graphic/*.ffr are committed under public/data/, which is also why the note above says
# the probes could in principle run here. test/gameData.ts now resolves to that data, and
# missing data fails instead of skipping.
#
# A few tests still default to ~/.cache/ffng-orig and do skip here (rooms.test.ts,
# gral-pushout.test.ts, and $FF_DATA_DIR in render-parity/enhanced-mapping) — 146 assertions
# that could be unskipped the same way, separately from the solvability work.
#
# `vite build` runs too. `tsc --noEmit` does not link or resolve assets, so a bundling
# break (a bad import path, an esbuild-only failure) passes typecheck and fails only
# when somebody serves the app — which, without this step, would be nobody until the
# release tag.
name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # CONTRIBUTING.md forbids absolute personal paths and session-id trailers in this
      # public repo, and .gitignore blocks the *files* that carry them (BRIEFING.md,
      # .copilot/, …). Nothing checked file *contents* — which is exactly how the two
      # that got in got in: both arrived inside GENERATED output (the Studio's
      # index.json, a generated type annotation in debugHooks.ts), where a reviewer
      # reading a diff stops looking. This is the missing half of that rule.
      #
      # The three docs that quote the forbidden shapes in order to forbid them are
      # excluded, as is this file.
      - name: No personal paths or session trailers
        run: |
          # `cut` keeps a minified generated file from dumping a megabyte-long line
          # into the log — the file:line reference is the useful part.
          hits=$(git grep -nIE '/(Users|home)/[a-z][a-z0-9._-]*/|Copilot-Session:' -- \
                   ':(exclude).gitignore' \
                   ':(exclude)CONTRIBUTING.md' \
                   ':(exclude)AGENTS.md' \
                   ':(exclude).github/workflows/checks.yml' | cut -c1-200) || true
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::A personal absolute path or a session-id trailer is committed. See CONTRIBUTING.md, 'Commit hygiene'."
            exit 1
          fi
          if git log -1 --format='%B' | grep -qiE '^[[:space:]]*Copilot-Session:'; then
            echo "::error::This commit carries a Copilot-Session trailer. See CONTRIBUTING.md, 'Commit hygiene'."
            exit 1
          fi
      # The unit suite seeds Math.random per file and per test (test/rng.setup.ts), so
      # this is deterministic without pinning a seed here.
      - run: npm run test
      # Not covered by typecheck: bundling, asset resolution, esbuild-only failures.
      - run: npm run build

  # The experimental native host (native/README.md). Not shipped; built here so a change in
  # src/ that breaks the native bundle shows up. macOS because the host's only shaders are
  # MSL and SDL GPU drives Metal there.
  #
  # Hosted macOS runners do expose Metal, both to SDL GPU and to Chromium's ANGLE, and the
  # two agree byte for byte there as they do locally — so the parity sweep is a real gate
  # here, not a smoke test. It fails on any differing frame and on any room outside the
  # spike's known gaps (KNOWN_GAPS in native/compare.mjs). The world map's parity
  # (native/compare-map.mjs, native GPU Surface2D vs the browser's 2D canvas) runs after it,
  # then the subtitles' (native/compare-subs.mjs: FreeType text vs the browser's DOM text,
  # a tolerance gate, with its self-test of wrong frames it must reject).
  #
  # Before it, the smoke gate (native/js/smoke.ts): every room with a recorded solution
  # played headless through the game's real flow modules as the native host wires them,
  # plus two rooms typed key by key through save, undo and load. ~40 s here. Then the map
  # smoke (native/js/mapSmoke.ts): the world map, its record panel and story pages, driven
  # key by key. A few seconds. Then the menu smoke (native/js/menuSmoke.ts): the pause menu,
  # confirm prompt, Options, Help and the Siri Remote's room mapping, driven by input events,
  # and the UI layout snapshot (native/ui-layout.snap.json). Then the sound gate (native/js/audioSmoke.ts): the mixer, every
  # speech and music decode (length and alignment against the originals), and PRVNI's
  # dialogue timing against the browser's. ~8 s. All three are headless: no audio device, the game itself drives the mixer.
  native-macos:
    # Manual only (Actions -> checks -> Run workflow). The same gate runs locally as
    # `npm run native:check` (native/check.mjs), which is what a PR touching native/ quotes.
    # Hosted macOS runners routinely queued 10-40 min before this ~10 min job even started,
    # so every PR waited on it for nothing a Mac on the desk cannot tell in a few minutes.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    # ~10 min when green. compare.mjs times out each native run, but not the WebGL side.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build tools only: SDL3, libwebp and FreeType are fetched by native/CMakeLists.txt at pinned,
      # hashed versions, so a Homebrew upgrade cannot move the parity result.
      - run: brew install cmake ninja
      - run: npm run typecheck:native
      - run: node native/build-js.mjs
      - run: cmake -S native -B native/build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: ninja -C native/build/cmake
      - name: Native smoke, every recorded solution through the real game flow
        timeout-minutes: 5
        run: >-
          native/build/cmake/ff4e-native native/build/game.js --root public --headless
          --smoke all --smoke-player 13,70 --store native/build/smoke-store.json
      - name: Native map smoke, the world map driven by keys through the real flow
        timeout-minutes: 2
        run: >-
          native/build/cmake/ff4e-native native/build/game.js --root public --headless
          --smoke-map --store native/build/smoke-map-store.json
      - name: Native menus, the pause menu, Options, Help and the remote, and the UI layout snapshot
        timeout-minutes: 2
        run: >-
          native/build/cmake/ff4e-native native/build/game.js --root public --headless
          --smoke-menus --store native/build/smoke-menus-store.json
      - name: Native sound, the mixer, every decode and PRVNI's dialogue timing
        timeout-minutes: 2
        run: >-
          native/build/cmake/ff4e-native native/build/game.js --root public --headless
          --smoke-audio --store native/build/smoke-audio-store.json
      - name: Native movies, the intro, its splash and the credits through the real flow
        timeout-minutes: 2
        run: >-
          native/build/cmake/ff4e-native native/build/game.js --root public --headless
          --smoke-movie --store native/build/smoke-movie-store.json
      - name: Native KUFRIK, the briefcase story, its skips, the tutorial demonstration and a Replay
        timeout-minutes: 3
        run: >-
          native/build/cmake/ff4e-native native/build/game.js --root public --headless
          --smoke-kufrik --store native/build/smoke-kufrik-store.json
      - run: npx playwright install chromium
      - name: Native vs WebGL parity, all 72 rooms
        run: node --import tsx native/compare.mjs --all
      - name: Native vs canvas parity, the world map
        if: success() || failure()
        run: node --import tsx native/compare-map.mjs
      - name: Native vs DOM subtitles, within tolerance, and the tolerance catching wrong text
        if: success() || failure()
        run: node --import tsx native/compare-subs.mjs --self-test
      - name: Native vs browser movies (frames, sound) and credits, within tolerance, and the tolerance catching wrong ones
        if: success() || failure()
        run: node --import tsx native/compare-media.mjs --self-test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-compare
          path: |
            native/build/compare/
            native/build/compare-map/
            native/build/compare-subs/
            native/build/compare-media/
          if-no-files-found: ignore
