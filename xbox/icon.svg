<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Fish Fillets 4ever">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#1b2740"/>
      <stop offset="55%" stop-color="#101826"/>
      <stop offset="100%" stop-color="#0a0d16"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5fd0ff"/>
      <stop offset="55%" stop-color="#2f9bd8"/>
      <stop offset="100%" stop-color="#1f6fa8"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ee0ff"/>
      <stop offset="100%" stop-color="#2f9bd8"/>
    </linearGradient>
  </defs>

  <!-- brand background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- bubbles -->
  <circle cx="372" cy="150" r="10" fill="#8fd8ff" opacity="0.55"/>
  <circle cx="398" cy="120" r="6" fill="#8fd8ff" opacity="0.45"/>
  <circle cx="356" cy="120" r="4" fill="#8fd8ff" opacity="0.4"/>

  <!-- fish, swimming left -->
  <g transform="translate(256 268)">
    <!-- tail -->
    <path d="M120 0 L188 -58 Q168 0 188 58 Z" fill="url(#fin)"/>
    <!-- top fin -->
    <path d="M6 -60 Q46 -118 96 -74 Q54 -66 30 -44 Z" fill="url(#fin)" opacity="0.95"/>
    <!-- bottom fin -->
    <path d="M20 58 Q52 104 92 70 Q60 62 40 46 Z" fill="url(#fin)" opacity="0.85"/>
    <!-- body -->
    <path d="M-160 0 Q-96 -92 24 -78 Q120 -66 136 0 Q120 66 24 78 Q-96 92 -160 0 Z" fill="url(#body)"/>
    <!-- belly highlight -->
    <path d="M-150 6 Q-96 78 24 66 Q96 58 120 8 Q92 44 20 52 Q-96 62 -150 6 Z" fill="#bff0ff" opacity="0.28"/>
    <!-- eye -->
    <circle cx="-104" cy="-14" r="20" fill="#f4fbff"/>
    <circle cx="-110" cy="-12" r="10" fill="#0a1220"/>
    <circle cx="-114" cy="-16" r="3.5" fill="#ffffff"/>
    <!-- smile -->
    <path d="M-150 22 Q-128 40 -100 34" fill="none" stroke="#0a1220" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
